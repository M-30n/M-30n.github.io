<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Subtle background glow effect */
        body::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(139, 0, 0, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        h1 span {
            color: #8b0000;
        }

        .game-grid {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .game-card {
            background-color: #141414;
            border: 2px solid #222222;
            border-radius: 12px;
            width: 280px;
            padding: 30px 20px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        .game-card:hover {
            transform: translateY(-8px);
            border-color: #8b0000;
            box-shadow: 0 0 20px rgba(139, 0, 0, 0.4);
        }

        .game-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }

        .game-card:hover .game-icon {
            transform: scale(1.1);
        }

        .game-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .game-desc {
            font-size: 0.9rem;
            color: #aaaaaa;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Game <span>Portal</span></h1>
        
        <div class="game-grid">
            <!-- Retro Bowl College Card -->
            <a href="https://github.io" class="game-card">
                <div class="game-icon">🏈</div>
                <div class="game-title">Retro Bowl College</div>
                <div class="game-desc">Manage your school team, recruit stars, and build a collegiate dynasty.</div>
            </a>

            <!-- Retro Bowl Card -->
            <a href="https://github.io" class="game-card">
                <div class="game-icon">🎮</div>
                <div class="game-title">Retro Bowl</div>
                <div class="game-desc">The ultimate classic football management game. Take your franchise to the championship.</div>
            </a>
        </div>
    </div>

</body>
</html>
